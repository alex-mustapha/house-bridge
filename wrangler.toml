name = "linear-discord-bridge"
main = "src/index.js"
compatibility_date = "2026-01-01"
# Pin the owning account. Without this wrangler silently targets whichever
# account happens to be logged in — with the wrong one active it will create a
# second, unrelated Worker of the same name instead of updating this one.
account_id = "8b74b28235d1fb890e45422ca8edc2c7"

# Daily digest + recurring-chore creation.
# IMPORTANT: Cloudflare cron is UTC and does NOT observe daylight saving.
# "0 12 * * *" = 8:00am EDT (summer) / 7:00am EST (winter) for US Eastern.
# If you'd rather hold a steady 8am through winter, switch to "0 13 * * *"
# when EST starts (early November) and back to "0 12 * * *" in March.
[triggers]
crons = ["0 12 * * *"]

# Non-secret config. Secrets (API keys, webhook URLs) are set via
# `wrangler secret put NAME` — see README.
[vars]
# How many days ahead the daily digest looks. 0 = only today + overdue.
DUE_LOOKAHEAD_DAYS = "0"
# How far ahead the digest's per-person "Upcoming" list looks. Routine chores
# that recur weekly or more often are filtered OUT of it — they're already in
# today's list on the day, and previewing them buries everything else. What
# shows is ad-hoc tasks, project work, and chores that come round every few
# months. 14 days because that work is sparse; a 7-day window often showed
# nothing. Capped in practice by GEN_HORIZON_DAYS for recurring chores.
WEEK_LOOKAHEAD_DAYS = "14"
# Which cadences are treated as "routine" and hidden from the Upcoming list.
# Add biweekly to also hide every-other-week chores (Mop, Litterbox, Mow lawn,
# Change sheets, Nero bath, Nero nails) and leave only monthly-and-rarer plus
# ad-hoc/project work. Kept separate from the on-miss cadence threshold on
# purpose — this is a display choice, not a policy one.
PREVIEW_HIDE_CADENCES = "daily,weekly"
# `every: N` chores with a period at or below this many days count as routine.
PREVIEW_HIDE_INTERVAL_DAYS = "7"
# Warn in #bot-log once active (non-archived) issues reach this count.
# Free plan caps at 250; 220 gives you runway to archive.
CAP_WARN_AT = "220"
# Linear project that holds recurring-chore template tickets.
RECURRING_PROJECT = "Recurring"
# Deep link to the Recurring project, surfaced in `/chores help`. Recurring
# chores are authored as Linear templates rather than from Discord, so this
# is where someone asking "how do I add a repeating chore?" needs to land.
RECURRING_PROJECT_URL = "https://linear.app/alex-kristal/project/recurring-11976335748e/overview"
# How many days ahead to materialize chores (default 7). Larger = a one-time
# fill; later weekly runs only add the new far days (dedup skips the rest).
# Kept at two weeks: far enough to see what's coming, short enough that the
# active-issue count stays clear of Linear's free 250 cap and future copies
# don't sit around for a month alongside work that hasn't been done yet.
GEN_HORIZON_DAYS = "14"
# Max chores created per generation run, to stay under the Worker 50-subrequest
# limit. Only bites on a big one-time fill; run /chores sync again to continue.
GEN_MAX_CREATES = "40"
# How many days a RESOLVED chore (completed or canceled) stays visible in
# Linear before the daily auto-archive sweeps it. Archiving is not deletion:
# the issue stays in Linear's archive and D1 keeps the stats either way — it
# just stops counting against the free plan's 250 active-issue cap.
# 7 days is plenty to glance back at what got done; 30 (the old default) had
# ~80 finished chores sitting against the cap at any time.
CHORE_RETENTION_DAYS = "7"
# Max issues archived per run (the sweep runs 6 days a week, not Mondays).
ARCHIVE_MAX = "30"
# How many days past due a `replace` chore must be before the sweep archives it.
# Generation runs daily, so this — not the cron day — is what decides how long
# something may slip. 7 gives every chore a full week regardless of which weekday
# it falls on. Set "0" for the old behaviour (sweep as soon as it's past due).
# Only affects chores whose on-miss resolves to `replace` (weekly or more
# frequent by default); rarer chores are never swept.
SWEEP_GRACE_DAYS = "7"
# Team key used for the weekly scoreboard.
CHORES_TEAM = "CHO"
# Project that spawned recurring chores are created in (and tracked under).
CHORES_PROJECT = "House Chores"
# Project for one-off chores added via `/chores add` (no cadence, won't recur).
ADHOC_PROJECT = "Ad Hoc"
# Public origin of this Worker, used to print calendar-subscription URLs.
PUBLIC_BASE_URL = "https://linear-discord-bridge.muffinfactory.workers.dev"
# Rotation load skew: higher weight = bigger share of the week's chore minutes.
# Per-person overrides set via `/chores weight` (D1) take precedence.
ROTATION_WEIGHTS = "Alex:60,Kristal:40"
# Title of a no-cadence template in the Recurring project to spawn (due at the
# pause start) whenever a whole-household /chores pause is set — e.g. a trip
# prep checklist. Leave the template absent to skip this.
VACATION_PREP_TITLE = "Vacation Prep"
# Channel the daily digest is posted to BY THE BOT (so it can carry "Done"
# buttons). #due-today. Requires the DISCORD_BOT_TOKEN secret + the bot having
# Send Messages here. If unset, the digest falls back to the DUE webhook.
DISCORD_DUE_CHANNEL_ID = "1519809360170324069"

# D1 database for long-term chore analytics (free tier).
[[d1_databases]]
binding = "DB"
database_name = "chore-stats"
database_id = "1f02a152-b650-443e-adb4-b9c71b8b9516"
